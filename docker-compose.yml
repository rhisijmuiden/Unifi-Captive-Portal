# Captive Portal with its database, as containers. For testing and small installs; the supported
# production install is still the Debian/LXC installer (Caddy, HTTPS hostnames, in-app updates).
#
#   cp docker.env.example docker.env      # then set APP_SECRET and PUBLIC_URL
#   docker compose --env-file docker.env up -d --build
#
# Admin panel on port 8080. Guests arrive on port 80: UniFi's "External portal server" is an IP
# address only, so the console sends guests to http://<that IP>/guest/s/<site>/.
name: captive-portal

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: captive
      POSTGRES_PASSWORD: ${DB_PASSWORD:-captive}
      POSTGRES_DB: captive
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captive -d captive"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: captive-portal:local
    environment:
      DATABASE_URL: postgres://captive:${DB_PASSWORD:-captive}@db:5432/captive
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in docker.env (openssl rand -hex 32)}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      UPDATE_REPO: ${UPDATE_REPO:-rhisijmuiden/Unifi-Captive-Portal}
    ports:
      - "${ADMIN_PORT:-8080}:8080"
      - "${GUEST_PORT:-80}:8080"
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped

  # Catches every e-mail the app sends (inbox on port 8025). Point the app's SMTP settings at
  # host "mail", port 1025, security "none", no authentication. Leave it out to use real mail.
  mail:
    image: axllent/mailpit:v1.27.0
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    profiles: ["mailpit"]
    restart: unless-stopped

volumes:
  db:
  data:
