name: Release

# A merge to main whose package.json carries a new version publishes that version:
#   1.2.0         -> stable channel
#   1.3.0-beta.1  -> test channel (marked as pre-release)
# Pushing a tag v1.2.0 by hand works too.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  # Build the Proxmox CT template again for an existing release (e.g. one from before templates existed)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)build the Proxmox CT template for, e.g. v1.0.1'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.version.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="v$pkg"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $pkg"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          flags="--generate-notes --target $GITHUB_SHA"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" $flags

  # Proxmox CT template, attached to the release. "Download from URL" under CT Templates in Proxmox:
  #   https://github.com/<repo>/releases/latest/download/captive-portal-debian-13-amd64.tar.zst  (newest stable)
  #   https://github.com/<repo>/releases/download/<tag>/captive-portal-debian-13-amd64.tar.zst   (a specific, e.g. test, version)
  template:
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.created == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Pick the release
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: echo "tag=${INPUT_TAG:-$RELEASE_TAG}" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Build the template
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sudo apt-get install -y -q zstd >/dev/null
          sudo ct/build-template.sh --ref "$TAG" --repo "https://github.com/${GITHUB_REPOSITORY}.git" --out dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" dist/captive-portal-debian-13-amd64.tar.zst dist/captive-portal-debian-13-amd64.tar.zst.sha256 --clobber
