name: Release

# A merge to main whose package.json carries a new version publishes that version:
#   1.2.0         -> stable channel
#   1.3.0-beta.1  -> test channel (marked as pre-release)
# Pushing a tag v1.2.0 by hand works too.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="v$pkg"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $pkg"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          flags="--generate-notes --target $GITHUB_SHA"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" $flags
